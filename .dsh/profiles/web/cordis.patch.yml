# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-skill
  name: '@deepseek-ai/dsh-client-ui-skill'
  disabled: true

- insert:
    - id: mathmodel
      name: '@deepseek-harness/dsh-mathmodel'
      inject:
        - credentials
        - settings
      config:
        skillRoot: !!js dshHomePath('skills')
    # 生图与视觉工具属于所有 Agent 模式的公共能力；连接配置仍由上面的
    # Host 插件统一管理，避免各 Preset 重复注册同名工具。
    - id: mathmodel-tools
      name: '@deepseek-harness/dsh-mathmodel/tools'

# 全局皮肤插件（上传图片为全局背景，自动取主色，含 Blur/Dim/面板不透明度微调）。
# 纯客户端插件：theme.register + settings.general.item 插槽，卸载即恢复官方主题。
# 激活方式：bundle 层（package.json dsh.profile.bundles + 包自带 cordis.patch.yml），
# dsh plugin 命令的 reconcile 会按依赖声明自动维护，此处不再手工 insert（同 id 双插会启动失败）。

# 统一订阅登录插件（Settings → Subscriptions 页，ChatGPT/Claude/Grok OAuth）。
# 走 bundle 层自激活；本地 0.5.2 版本补丁提供 Host-only subscriptionSessions，
# 并允许关闭上游 image_generate。该名称继续由 mathmodel-tools 独占；上游
# x_search、video_generate 与 Codex/Claude/Grok 对话路由保持启用。
- id: llm-subscriptions
  config:
    providers:
      - codex
      - claude
      - grok
    registerImageTool: false
    # Grok 模型目录覆盖：contextWindow 均为 xAI 官方值（api.x.ai/v1/models
    # 实测返回的 context_length 字段，2026-08-19 核验）。本机网络无法访问
    # cli-chat-proxy.grok.com（自动发现 ECONNRESET），未覆盖时全部模型回退
    # 默认 256k 窗口；配置 models.grok 后插件关闭自动发现，直接采用以下目录。
    models:
      grok:
        - id: grok-4.6
          name: Grok 4.6
          contextWindow: 500000
          inputModalities: [text, image]
        - id: grok-4.5
          name: Grok 4.5
          contextWindow: 500000
          inputModalities: [text, image]
        - id: grok-4.3
          name: Grok 4.3
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-4.20-0309-reasoning
          name: Grok 4.20 Reasoning
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-4.20-0309-non-reasoning
          name: Grok 4.20 Non-Reasoning
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-4.20-multi-agent-0309
          name: Grok 4.20 Multi-Agent
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-build-0.1
          name: Grok Build 0.1 (Code Fast)
          contextWindow: 256000
          inputModalities: [text, image]

# 工作区长期知识：bundle 自激活，主 patch 只覆盖安全配置，不重复 insert。
# 数据库存入 DSH_HOME/data，默认不进公开源码；所有持久变更需确认。
# 查询扩展关闭，避免检索隐式调用模型；global 写入名单为空。
- id: knowledge-sqlite
  config:
    gating: ask
    registerProbeTool: false
    databasePath: !!js dshHomePath('data/knowledge.sqlite')
    maxContentTokens: 2048
    queryExpansion:
      enabled: false
      maxOutputTokens: 300
      timeoutMs: 3000
      cache: true
    retrieval:
      topN: 8
      maxQueryTrigrams: 0
      maxCandidates: 100
    authorization:
      allowedGlobalWriters: []

# Antigravity 回退模型目录补充（2026-09-03）：Gemini 3.8 Flash 已在官方上线
# （ai.google.dev/gemini-api/docs/models/gemini-3.8-flash，stable，thinking 支持
# low/medium/high；antigravity.google/docs/models 已列出），但上游 v0.4.24 的
# DEFAULT_FALLBACK_MODELS 只收录到 gemini-3.7-flash。登录后目录改由 `agy models`
# 实时发现，此覆盖仅服务未登录/离线时的 /model 选择器；上游收录后应删除本条。
# fallbackModels 是整体替换语义，必须写全量清单。
- id: agy-link
  config:
    fallbackModels:
      - id: gemini-3.8-flash
        name: Gemini 3.8 Flash
        efforts: [low, medium, high]
      - id: gemini-3.7-flash
        name: Gemini 3.7 Flash
        efforts: [low, medium, high]
      - id: gemini-3.6-flash
        name: Gemini 3.6 Flash
        efforts: [low, medium, high]
      - id: gemini-3.5-flash
        name: Gemini 3.5 Flash
        efforts: [low, medium, high]
      - id: gemini-3.1-pro
        name: Gemini 3.1 Pro
        efforts: [low, high]
      - id: claude-sonnet-4-6
        name: Claude Sonnet 4.6 (Thinking)
      - id: claude-opus-4-6-thinking
        name: Claude Opus 4.6 (Thinking)
      - id: gpt-oss-120b-medium
        name: GPT-OSS 120B (Medium)

# WorkBuddy 桌面 App 模型接入（GOAL-74 引入，上游 v0.2.6，固定 commit fab6bf646aa3，
# MIT；仅供个人学习研究——复用本机 WorkBuddy App 登录态，非官方接口，上游更新可能
# 需要跟随调整）。bundle 自激活（自带 cordis.patch.yml insert llm-workbuddy），主
# patch 零改动：本机 App 凭据文件名为 workbuddy-desktop-ai.info（带 -ai 后缀），
# 本地派生补丁已在插件默认探测候选中加入该文件名（先后探测不带/带后缀两种），
# 无需 authFile 绝对路径覆盖，干净机器开箱即用；settings 卡片对 authFile 的
# 后续编辑热生效。
