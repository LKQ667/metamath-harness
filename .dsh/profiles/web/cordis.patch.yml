# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-skill
  name: '@deepseek-ai/dsh-client-ui-skill'
  disabled: true

- insert:
    - id: mathmodel
      name: '@deepseek-harness/dsh-mathmodel'
      inject:
        - credentials
        - settings
      config:
        skillRoot: !!js dshHomePath('skills')
    # 生图与视觉工具属于所有 Agent 模式的公共能力；连接配置仍由上面的
    # Host 插件统一管理，避免各 Preset 重复注册同名工具。
    - id: mathmodel-tools
      name: '@deepseek-harness/dsh-mathmodel/tools'

# 全局皮肤插件（上传图片为全局背景，自动取主色，含 Blur/Dim/面板不透明度微调）。
# 纯客户端插件：theme.register + settings.general.item 插槽，卸载即恢复官方主题。
# 激活方式：bundle 层（package.json dsh.profile.bundles + 包自带 cordis.patch.yml），
# dsh plugin 命令的 reconcile 会按依赖声明自动维护，此处不再手工 insert（同 id 双插会启动失败）。

# 订阅登录插件（Settings → Subscriptions 页，ChatGPT/Claude/Grok OAuth）。
# 走 bundle 层自激活（package.json dsh.profile.bundles）；此处只做 config 覆盖：
# providers 限定 claude+grok。原因：codex 路由会在启动时注册全局工具 image_generate，
# 与本地 mathmodel-tools 的 API 生图工具同名冲突（bundle 层先加载，后注册方启动失败）。
# 需要启用 ChatGPT 订阅时，改回 [codex, claude, grok] 并先处理本地生图工具的重名。
- id: llm-subscriptions
  config:
    providers:
      - claude
      - grok
    # Grok 模型目录覆盖：contextWindow 均为 xAI 官方值（api.x.ai/v1/models
    # 实测返回的 context_length 字段，2026-08-19 核验）。本机网络无法访问
    # cli-chat-proxy.grok.com（自动发现 ECONNRESET），未覆盖时全部模型回退
    # 默认 256k 窗口；配置 models.grok 后插件关闭自动发现，直接采用以下目录。
    models:
      grok:
        - id: grok-4.6
          name: Grok 4.6
          contextWindow: 500000
          inputModalities: [text, image]
        - id: grok-4.5
          name: Grok 4.5
          contextWindow: 500000
          inputModalities: [text, image]
        - id: grok-4.3
          name: Grok 4.3
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-4.20-0309-reasoning
          name: Grok 4.20 Reasoning
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-4.20-0309-non-reasoning
          name: Grok 4.20 Non-Reasoning
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-4.20-multi-agent-0309
          name: Grok 4.20 Multi-Agent
          contextWindow: 1000000
          inputModalities: [text, image]
        - id: grok-build-0.1
          name: Grok Build 0.1 (Code Fast)
          contextWindow: 256000
          inputModalities: [text, image]

# ChatGPT/Codex 订阅 OAuth 登录插件（ziyou979/dsh-llm-oauth，bundle 层自激活）。
# 默认休眠（providers 为空，登录后才注册聊天路由），不注册任何工具 → 与本地
# mathmodel-tools 的 image_generate 零冲突。catalog 限定 openai-codex：OAuth 设置页
# 只显示 ChatGPT 登录；Claude/Grok 订阅登录仍由上面的 llm-subscriptions 负责。
# 登录凭据写入 $DSH_HOME/pi-ai-oauth.json（openai-codex 条目），
# dsh-mathmodel 的 codex-subscription 生图连接直接复用该凭据。
- id: llm-oauth
  config:
    catalog:
      - openai-codex
