packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  '@google/genai': false
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.6'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - dsh-better-sidebar@0.17.1
overrides:
  '@deepseek-harness/dsh-mathmodel': link:../../../plugins/dsh-mathmodel
patchedDependencies:
  dsh-plugin-subscriptions@0.6.0: patches/dsh-plugin-subscriptions@0.6.0.patch

# patchedDependencies（dsh-session-link@0.1.4 与 dsh-plugin-subscriptions@0.5.2）
# 已随 DSH 0.1.2-rc.1 升级移除/替换：session-link 不再兼容新 dsh-llm（assertNever
# 导出移除）且官方原生提供 session-reference；subscriptions 升 0.6.0（自带
# ToolCallId??CallId 双适配），本地补丁由 0.6.0 版补丁重放（见 patches/）。
