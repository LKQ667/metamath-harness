packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  '@google/genai': false
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.6'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - dsh-better-sidebar@0.17.1
overrides:
  '@deepseek-harness/dsh-mathmodel': link:../../../plugins/dsh-mathmodel
  # dsh-session-link@0.1.4 声明 ^0.1.0-rc.6，semver 0.x-prerelease 规则解析到
  # 0.1.0-rc.8（assertNever 从 dsh-llm re-export，0.1.2-rc.1 起 dsh-llm 不再
  # re-export，报 does not provide an export named 'assertNever'）。对齐到与
  # DSH 0.1.2-rc.1 全局包同版本的官方适配版（assertNever 改从 dsh-util-values
  # 导入，session-link 所需 API 全保留）。升级 DSH 时同步复核此 override。
  '@deepseek-ai/dsh-session-reference': 0.1.2-rc.1
patchedDependencies:
  dsh-plugin-subscriptions@0.6.0: patches/dsh-plugin-subscriptions@0.6.0.patch
  dsh-session-link@0.1.4: patches/dsh-session-link@0.1.4.patch

# dsh-session-link@0.1.4 于 DSH 0.1.2-rc.1 下恢复（goal-76 实测兼容）：
# 去重补丁必带——0.1.1-rc.2 起 web-app 已原生挂载 session-reference，
# 本地 cordis.patch.yml 只插入 session-link 一行，避免 duplicate loader
# entry id；与官方 session-reference 共存（见维护范式 §5）。
