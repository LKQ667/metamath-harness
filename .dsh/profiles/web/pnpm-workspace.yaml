packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  '@google/genai': false
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - dsh-agy-link@0.6.105
  - dsh-connect-trae@4.19.3
  - dsh-provider-qoder@0.6.4
  - dsh-workbuddy-connect@0.7.9
  - dsh-free-search@0.9.89
  - dsh-better-sidebar@0.33.0
  - dsh-plugin-subscriptions@0.9.15
  - dsh-session-link@0.2.5
overrides:
  # dsh-session-link@0.2.5 声明 ^0.2.0-rc.2；强制对齐当前 DSH 0.2.2-rc.5 避免重复模块实例。
  '@deepseek-ai/dsh-session-reference': 0.2.2-rc.5
patchedDependencies:
  # mathmodel 继续独占 image_generate，并通过受限 Host service 复用
  # Codex/Grok 订阅会话；不把 refresh token 暴露给插件。
  # 注：dsh-session-link@0.2.5 已原生提供 /s/<sessionId> 深链重定向，旧 0.2.1 补丁已退役。
  dsh-plugin-subscriptions@0.9.15: patches/dsh-plugin-subscriptions@0.9.15.patch
