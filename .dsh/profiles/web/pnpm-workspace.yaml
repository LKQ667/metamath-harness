packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  '@google/genai': false
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.6'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - dsh-better-sidebar@0.19.1
  - dsh-plugin-subscriptions@0.9.2
  - dsh-session-link@0.2.1
overrides:
  '@deepseek-harness/dsh-mathmodel': link:../../../plugins/dsh-mathmodel
patchedDependencies:
  # mathmodel 继续独占 image_generate，并通过受限 Host service 复用
  # Codex/Grok 订阅会话；不把 refresh token 暴露给插件。
  dsh-plugin-subscriptions@0.9.2: patches/dsh-plugin-subscriptions@0.9.2.patch
  # 0.2.1 已吸收旧 0.1.4 补丁的第①（cordis.patch.yml 去重）与第②（slots.inject
  # 延迟注册）两段；仅第③段（/s/<sessionId> 深链启动页路由）上游仍未提供，
  # DSH 0.1.5-rc.2 的 frontend-static 依旧只在 "/" 提供 SPA index。
  dsh-session-link@0.2.1: patches/dsh-session-link@0.2.1.patch
