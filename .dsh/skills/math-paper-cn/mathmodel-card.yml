schema: dsh.mathmodel.card/v1
skill: math-paper-cn
title: 中文数学建模论文一键运行
summary: 从赛题与数据持续完成建模、绘图、写作、校验和最终 PDF。
category: 一键论文
fields:
  - id: problem_path
    label: 赛题或材料路径
    type: path
    required: true
    placeholder: 选择赛题 PDF、Word 或项目目录
  - id: output_dir
    label: 项目输出目录
    type: path
    required: true
    placeholder: 选择一个新项目目录
  - id: body_pages
    label: 正文最低页数
    type: number
    default: 16
    min: 16
    max: 60
  - id: competition_language
    label: 赛事语言
    type: select
    default: 中文
    options: [中文, 英文]
  - id: drawing_mode
    label: 非数据图绘制方式
    type: select
    default: Draw.io成图+AI概念提示词
    options: [Draw.io成图+AI概念提示词, Draw.io成图, AI全自动绘图]
  - id: bar_policy
    label: 柱状图策略
    type: select
    default: 少用
    options: [禁用, 少用, 正常]
  - id: three_d_preference
    label: 三维图偏好
    type: select
    default: 适合时建议
    options: [适合时建议, 优先考虑, 不主动使用]
  - id: figure_total
    label: 全文图片总数
    type: number
    default: 15
    min: 1
    max: 40
    description: 全文最终入文图片的目标总数，可按赛事要求自定义。
  - id: reference_excellent_papers
    label: 参考往年优秀论文完成度
    type: boolean
    default: false
    description: 开启后从随程序分发的国赛论文库中按当前题号最多选取两篇，只校准完成度，缺样本不阻断。
  - id: run_to_pdf
    label: 全自动持续到最终 PDF
    type: boolean
    default: true
  - id: ai_image_limit
    label: AI 自动成图总上限
    type: number
    default: 0
    min: 0
    max: 20
    description: 0 表示只生成提示词，不调用付费生图。
  - id: confirm_paid_calls
    label: 已确认允许付费生图调用
    type: boolean
    default: false
  - id: user_notes
    label: 补充要求
    type: text
prompt:
  objective: 完成中文数学建模论文并交付通过门禁的最终 PDF
  instructions:
    - 已锁定的卡片配置不得重复询问
    - 论文正文、图题、图例、坐标轴与图内文字统一采用赛事语言字段选择的中文或英文
    - 所有入文图片按所选语言达到顶刊一区 Top 1 的信息密度、排版、配色与可读性标准
    - 全文图片总数以 figure_total 为统一目标，不再按每问平均分配；按各问信息量动态配置且禁止重复凑图
    - 除不可替代的赛题、数据或官方规则缺失外持续自主推进
    - 严格避免死循环：同一失败最多连续重试三次后必须切换策略，禁止无状态变化的重复执行
    - 保留现有 step0-step5、结果唯一源、绘图和 PDF 硬门禁
    - 未同时满足供应商健康、数量上限和付费确认时禁止自动 AI 成图
help:
  purpose: 一键完成中文数学建模竞赛论文全流程。
  inputs: [赛题与数据路径, 输出目录, 页数与绘图策略]
  outputs: [可复现项目, Draw.io与数据图, LaTeX源文件, 最终PDF]
  limits: [不得编造数据或参考文献, 失败原因相同最多重试三次, 不以堆图或套话凑页]
  dependencies: [Python科学计算包, XeLaTeX与latexmk, Draw.io, Poppler]
