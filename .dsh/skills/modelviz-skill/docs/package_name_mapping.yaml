networkx: networkx
plotly: plotly
shap: shap
xgboost: xgboost
lightgbm: lightgbm
catboost: catboost
rasterio: rasterio
pingouin: pingouin
pygam: pygam
ternary: python-ternary
joblib: joblib
statsmodels: statsmodels
tqdm: tqdm
skbio: scikit-bio
osgeo: GDAL
factor_analyzer: factor_analyzer
matplotlib_venn: matplotlib-venn
skill_metrics: SkillMetrics
PyALE: PyALE
geoshapley: geoshapley
