# import 名与 pip 包名映射。仅使用明确已知映射，不让模型猜测包名。
# 键是模板代码中出现的 import 顶层模块名，值是对应的 pip 包名。
# 模板脚本中出现的新第三方库需要同步登记到这里，否则依赖检查阶段会以
# 「无法映射包名」为由中止，而不是由模型猜测一个包名去安装。
