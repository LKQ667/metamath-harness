schema: dsh.mathmodel.card/v1
skill: ai-draw-skills
title: 科研配图提示词分析
summary: 判断段落是否需要配图，并生成中文顶刊风格提示词与占位信息。
category: 科研配图
fields:
  - id: source_path
    label: 文稿或段落来源
    type: path
    required: true
  - id: purpose
    label: 配图目的
    type: select
    default: 由内容分析
    options: [由内容分析, 解释机理, 展示模型结构, 概括技术路线, 对比方案, 说明实验流程]
  - id: figure_type
    label: 图类型
    type: multiselect
    default: [由内容分析]
    options: [由内容分析, 原理图, 模型图, 概念示意图, 技术路线图, 流程图]
  - id: style
    label: 视觉风格
    type: select
    default: 中文顶刊一区
    options: [中文顶刊一区, Nature简洁, 工程技术路线, 教材清晰]
  - id: aspect_ratio
    label: 画面比例
    type: select
    default: 16:9
    options: [16:9, 4:3, 1:1, 3:4]
  - id: prompt_count
    label: 提示词方案数
    type: number
    default: 3
    min: 1
    max: 6
  - id: prompt_only
    label: 只生成提示词和占位
    type: boolean
    default: true
  - id: user_notes
    label: 补充要求
    type: text
prompt:
  objective: 分析科研文稿的配图必要性并生成可执行提示词
  instructions:
    - 默认只输出提示词和占位信息，不直接生图
    - 生图模型、Base URL 与 Key 统一在“设置 > 模型 > 生图模型”中配置，Key 不得进入草稿
    - 图中中文、符号、层级和箭头关系必须明确
    - 不为不需要配图的段落强行设计图片
help:
  purpose: 为论文段落规划原理图、模型图或概念示意图。
  inputs: [文稿段落, 配图目的, 风格和比例]
  outputs: [必要性判断, 提示词方案, 占位框与图注建议]
  limits: [默认不直接生成图片, 不虚构文稿外机制]
  dependencies: [可读取的文稿来源]
